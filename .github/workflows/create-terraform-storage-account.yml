name: 'Create Terraform State Storage Account'

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string
      state_rg_name:
        description: 'Resource Group Name for State'
        required: false
        default: 'rg-tfstate-prod'
        type: string
      state_sa_name:
        description: 'Storage Account Name for State'
        required: false
        default: 'stcorpplatformgithubprod'
        type: string
      state_container_name:
        description: 'Blob Container Name for State'
        required: false
        default: 'corpplatformgithubprod'
        type: string
      state_location:
        description: 'Azure Region Location'
        required: false
        default: 'centralus'
        type: string

permissions:
  id-token: write  # Required for Azure OIDC Login
  contents: read

jobs:
  create-storage:
    name: 'Ensure Terraform Storage Backend'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Azure CLI Login (OIDC Passwordless)'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: 'Run Storage Provisioning Script'
        uses: azure/cli@v2
        with:
          inlineScript: |
            bash "$GITHUB_WORKSPACE/.github/scripts/azure-github-actions-diagnose.sh"