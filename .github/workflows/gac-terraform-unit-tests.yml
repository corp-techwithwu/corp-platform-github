name: 'Terraform Unit Tests'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  terraform-unit-tests:
    name: 'Terraform Unit Tests'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Install Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Validate code format
    - name: Terraform Format Check
      run: terraform fmt -check
      working-directory: infraascode

    # Initialize Terraform (only perform format and syntax static checks when backend=false)
    - name: Terraform Init
      run: terraform init -backend=false
      working-directory: infraascode

    # Validate Terraform code logic and structure
    - name: Terraform Validate
      run: terraform validate
      working-directory: infraascode

    # Use Checkov to scan Terraform code for security issues
    - name: Run Checkov action
      id: checkov
      uses: bridgecrewio/checkov-action@master
      with: 
        framework: terraform
        directory: infraascode # scan the infraascode directory

    # Upload SARIF report to GitHub Advanced Security
    - name: Upload SARIF file
      if: success() || failure()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
        category: checkov